
services:
  mongo:
    image: mongo:8.0
    container_name: network-lab-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db

    networks:
      - app-network

    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: network-lab-api
    restart: unless-stopped

    environment:
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/network_lab?authSource=admin

    expose:
      - "3000"

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: network-lab-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
